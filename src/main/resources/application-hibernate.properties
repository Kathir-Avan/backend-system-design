# ==============================================================
# HIBERNATE NATIVE PROFILE — application-hibernate.properties
# ==============================================================
#
# ACTIVATING THIS PROFILE SWITCHES THE DAO LAYER:
#   JpaProductDAO  (default)  → active when profile is NOT "hibernate"
#   HibernateProductDAO       → active when profile IS "hibernate"
#
# HOW TO ACTIVATE:
#   Option 1 — Command line:
#     java -jar app.jar --spring.profiles.active=hibernate
#
#   Option 2 — Maven:
#     mvn spring-boot:run -Dspring.profiles.active=hibernate
#
#   Option 3 — In application.properties:
#     spring.profiles.active=hibernate
#
#   Option 4 — Environment variable (Docker/K8s):
#     SPRING_PROFILES_ACTIVE=hibernate
#
# WHAT CHANGES IN HIBERNATE MODE?
#   - HibernateProductDAO is loaded (uses Session, HQL, Criteria API)
#   - JpaProductDAO is NOT loaded (excluded by @Profile)
#   - ProductRepository is still in the Spring context but unused
#   - All other layers (service, controller, DTO) are IDENTICAL
#
# THIS IS THE POWER OF THE DAO PATTERN:
#   Switching persistence strategy = ONE profile flag, ZERO code changes.
# ==============================================================

# Show HQL/SQL in Hibernate mode for debugging
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hibernate statistics: prints query execution counts to console.
# Useful for detecting N+1 query problems in Hibernate mode.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
