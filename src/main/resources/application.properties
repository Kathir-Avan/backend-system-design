# ==============================================================
# APPLICATION PROPERTIES — application.properties
# ==============================================================
#
# This file contains BASE configuration shared across all profiles.
# Profile-specific files OVERRIDE these values:
#   application-dev.properties  → local development
#   application-prod.properties → production (loaded from env vars)
#   application-hibernate.properties → Hibernate-native mode
#
# PROFILE ACTIVATION:
#   Command line:   java -jar app.jar --spring.profiles.active=prod
#   Maven:          mvn spring-boot:run -Dspring.profiles.active=dev
#   Environment:    SPRING_PROFILES_ACTIVE=prod
#   Docker:         ENV SPRING_PROFILES_ACTIVE=prod
#
# In production (Amazon/Netflix style), secrets like passwords are
# NEVER hardcoded here. They are injected via:
#   - AWS Secrets Manager / Parameter Store
#   - Kubernetes Secrets (environment variables)
#   - HashiCorp Vault
# ==============================================================

# ------------------------------------------------
# APPLICATION INFO
# ------------------------------------------------
spring.application.name=springboot-production
server.port=8080

# Servlet context path — all endpoints become /api/v1/...
# Combined with @RequestMapping this avoids duplicating /api prefix
# server.servlet.context-path=/   ← left blank intentionally

# ------------------------------------------------
# DATASOURCE — MySQL (override per environment)
# ------------------------------------------------
# In production: these come from environment variables or secrets manager.
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/production_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
# IMPORTANT: do NOT commit real passwords. Use an environment variable or local properties file.
# Example: export DB_PASSWORD=mysecret && mvn -DDB_PASSWORD=$DB_PASSWORD spring-boot:run
spring.datasource.password=8122852484
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------
# HIKARICP CONNECTION POOL
# ------------------------------------------------
# HikariCP is the default Spring Boot connection pool — fastest available.
# These settings are tuned for moderate production load.
# At Netflix scale: pool size = (cores * 2) + effective spindle count.
spring.datasource.hikari.pool-name=ProductionHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Validates connections before checkout — prevents stale connection errors
spring.datasource.hikari.connection-test-query=SELECT 1

# ------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------
# validate: Hibernate checks the entity mappings match the DB schema.
# NEVER use create or create-drop in production — Flyway handles schema.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in dev only — disabled here, enabled in application-dev.properties
spring.jpa.show-sql=false

# Format SQL for readability when show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Prevents N+1 queries from silently loading entire object graphs.
# OpenSessionInView keeps the Session open for the whole HTTP request —
# fine for small apps, but causes hidden lazy-load queries in complex APIs.
# Set to false for explicit control. Use @Transactional in service layer.
spring.jpa.open-in-view=false

# Hibernate dialect — auto-detected from JDBC URL in Spring Boot 3+,
# but explicit is better for clarity and avoiding auto-detect surprises.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Batch inserts/updates: groups multiple SQL statements into one DB round-trip.
# Critical performance optimization for bulk operations.
# Must match: spring.jpa.properties.hibernate.jdbc.batch_size
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Second-level cache: disabled by default (requires setup).
# Production: use Ehcache or Hazelcast for L2 cache on read-heavy entities.
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# ------------------------------------------------
# FLYWAY — Database Migration
# ------------------------------------------------
# Flyway runs automatically on startup if enabled=true.
# It checks the flyway_schema_history table and applies any new migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Out-of-order=false: strictly sequential version numbers required.
# Set to true only when multiple branches apply migrations concurrently.
spring.flyway.out-of-order=false

# ------------------------------------------------
# ACTUATOR — Health checks and metrics
# ------------------------------------------------
# Expose only health and info for external load-balancer checks.
# Full metrics endpoint secured separately in production.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Custom info fields — visible at /actuator/info
info.app.name=Spring Boot Production Demo
info.app.version=1.0.0
info.app.description=Production-grade REST API with JPA/Hibernate, DTO, DAO layers

# ------------------------------------------------
# JACKSON — JSON Serialization
# ------------------------------------------------
# Do NOT serialize null fields — keeps responses clean and small.
spring.jackson.default-property-inclusion=non_null
# ISO 8601 format for dates: "2024-01-15T10:30:00" instead of epoch millis.
spring.jackson.serialization.write-dates-as-timestamps=false
# Fail on unknown JSON fields — prevents silent data loss during deserialization.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ------------------------------------------------
# LOGGING
# ------------------------------------------------
# Root log level: INFO in prod (WARN for less noise, DEBUG for dev)
logging.level.root=INFO
logging.level.com.production.app=INFO
# Show SQL parameter values in dev (requires show-sql=true)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ------------------------------------------------
# CORS (read by WebConfig.java)
# ------------------------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
