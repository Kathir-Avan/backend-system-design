# ==============================================================
# DEV PROFILE — application-dev.properties
# ==============================================================
# Active when: spring.profiles.active=dev
# Overrides base application.properties for local development.
# ==============================================================

# Show SQL queries and their bound parameters in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# More verbose app logging in dev
logging.level.com.production.app=DEBUG

# Dev DB — can point to local Docker MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/production_db_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Smaller pool in dev — don't monopolize DB connections
spring.datasource.hikari.maximum-pool-size=5

# CORS: allow all localhost ports in dev
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8081
